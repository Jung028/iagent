name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t iagent-center:${{ github.sha }} ./services/iagent-center
      # Add registry push steps here when registry is configured
