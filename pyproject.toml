[project]
name = "iagent"
version = "0.1.0"
description = "iAgent Center — AI orchestration layer for eWallet platform"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["services/iagent-center"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
